<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Crear cuenta - Rutas de Avistamiento de Aves</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================================
        ENCABEZADO
    ================================= -->

    <header>

        <div class="logo">
            <h1>Rutas de Avistamiento de Aves</h1>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="aves.html">Aves</a></li>
                <li><a href="rutas.html">Rutas</a></li>
                <li><a href="recomendaciones.html">Recomendaciones</a></li>
            </ul>
        </nav>

    </header>


    <!-- ================================
        REGISTRO
    ================================= -->

    <main>

        <section class="seccion-registro">

            <div class="formulario-registro">

                <h2>🌿 Crear una cuenta</h2>

                <p>
                    Regístrate para guardar tus aves y rutas favoritas.
                </p>


                <form id="formulario-registro">

                    <div class="campo-formulario">

                        <label for="nombre">
                            Nombre
                        </label>

                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="Ingresa tu nombre"
                            required
                        >

                    </div>


                    <div class="campo-formulario">

                        <label for="correo">
                            Correo electrónico
                        </label>

                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="ejemplo@correo.com"
                            required
                        >

                    </div>


                    <div class="campo-formulario">

                        <label for="contrasena">
                            Contraseña
                        </label>

                        <input
                            type="password"
                            id="contrasena"
                            name="contrasena"
                            placeholder="Crea una contraseña"
                            required
                        >

                    </div>


                    <div class="campo-formulario">

                        <label for="confirmar-contrasena">
                            Confirmar contraseña
                        </label>

                        <input
                            type="password"
                            id="confirmar-contrasena"
                            name="confirmar-contrasena"
                            placeholder="Repite tu contraseña"
                            required
                        >

                    </div>


                    <button type="submit" class="boton-registro">
                        Crear cuenta
                    </button>

                </form>


                <p class="enlace-login">
                    ¿Ya tienes una cuenta?
                    <a href="login.html">Inicia sesión</a>
                </p>

            </div>

        </section>

    </main>


    <!-- ================================
         PIE DE PÁGINA
    ================================= -->

    <footer>

        <p>
            © 2026 Rutas de Avistamiento de Aves
        </p>

        <p>
            Popayán, Cauca - Colombia
        </p>

    </footer>


    <script src="registro.js"></script>

</body>

</html>
